<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Školka</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F8F9F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Školka">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  /* Jen skořápka. Vzhled je celý v desce z plátna a tenhle soubor do něj
     nemluví — jediná výjimka je roztažení desky z 1194×834 na skutečnou
     obrazovku tabletu. */
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #F8F9F7;
    overscroll-behavior: none;
  }
  #deska { min-height: 100dvh; }

  /* Deska je nakreslená na pevný rozměr (třída 1194×834, ředitelna
     1440×900). Vnitřek je pružný, takže ji roztáhneme na celé okno; když
     je okno menší, shell.js ji celou zmenší (zoom), aby se vždycky vešla.
     --w, --h a --z nastavuje shell.js. */
  html, body { overflow: hidden; }
  #deska > div {
    width: var(--w, 100vw) !important;
    height: var(--h, 100dvh) !important;
    zoom: var(--z, 1);
  }

  #nacitam {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    font: 15px/1.4 system-ui, sans-serif; color: #5A5C60;
  }
  #nacitam[hidden] { display: none; }

  #chyba {
    margin: 0; padding: 24px;
    font: 15px/1.5 system-ui, sans-serif; color: #7A4300;
    background: #FFF1E0;
  }
  #chyba[hidden] { display: none; }
</style>
</head>
<body>

<div id="deska" role="application" aria-label="Školka"></div>
<p id="nacitam">Načítám…</p>
<pre id="chyba" hidden></pre>

<script src="qrcode.js"></script>
<script src="dc.js"></script>
<script src="shell.js"></script>
</body>
</html>
